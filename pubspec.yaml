name: nearbnb_app
description: NearBnB guest app. Search, book by the hour, pay and manage trips.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State and navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  # Talking to api.nearbnb.com
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  # Look and feel
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  # Payments, links, push
  flutter_stripe: ^11.2.0
  url_launcher: ^6.3.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
