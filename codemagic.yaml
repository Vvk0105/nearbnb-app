# Codemagic builds the iPhone app on a cloud Mac and sends it to TestFlight. See docs/IOS.md for the one-time setup.
workflows:
  ios-testflight:
    name: iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic        # the name given to the App Store Connect API key in Codemagic (Teams > Integrations)
    environment:
      groups:
        - firebase_ios                    # IOS_FIREBASE_API_KEY, IOS_FIREBASE_APP_ID, IOS_FIREBASE_SENDER_ID, IOS_FIREBASE_PROJECT_ID, CERTIFICATE_PRIVATE_KEY
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events: []                          # builds are started by hand ("Start new build"), not on every push
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Install iOS pods
        script: |
          cd ios
          pod install
      - name: Prepare the keychain
        script: keychain initialize
      - name: Create or fetch the Apple signing files (certificate and App Store profile) for com.nearbnb.app
        script: |
          app-store-connect fetch-signing-files "com.nearbnb.app"             --type IOS_APP_STORE             --create
      - name: Add the certificate to the keychain
        script: keychain add-certificates
      - name: Set up code signing on the Xcode project
        script: xcode-project use-profiles
      - name: Build the iPhone app
        script: |
          flutter build ipa --release             --build-name=0.1.0             --build-number=$BUILD_NUMBER             --export-options-plist=/Users/builder/export_options.plist             --dart-define=IOS_FIREBASE_API_KEY=$IOS_FIREBASE_API_KEY             --dart-define=IOS_FIREBASE_APP_ID=$IOS_FIREBASE_APP_ID             --dart-define=IOS_FIREBASE_SENDER_ID=$IOS_FIREBASE_SENDER_ID             --dart-define=IOS_FIREBASE_PROJECT_ID=$IOS_FIREBASE_PROJECT_ID
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
